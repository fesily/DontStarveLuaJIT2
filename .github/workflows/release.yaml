name: build

permissions:
  contents: write

on:
  push:
    branches:
      - master
      - fix/luajit-force-enable-mod
    tags:
      - "*"
  pull_request:
    branches:
      - master

jobs:
  compile:
    env:
      # Single source for the CMake configuration of shipped plugins: it decides both
      # the build and the build_config stamp in meta/manifest (installs refuse mismatches).
      PLUGIN_BUILD_CONFIG: RelWithDebInfo
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-bincache
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-bincache,readwrite
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, target: windows, platform: win32-x64 }
          - { os: ubuntu-24.04,   target: linux,   platform: linux-x64 }
          # - { os: macos-14,       target: macos,   platform: macos-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Restore ANGLE cache
        if: ${{ matrix.target == 'windows' }}
        id: angle-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ github.workspace }}/3rd/angle
            ${{ github.workspace }}/.angle-bincache
          key: ${{ runner.os }}-angle-${{ hashFiles('tools/angle/**', 'cmake/ports/angle/**', 'cmake/custom-triplets/**', 'tools/setup_angle.py') }}
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-bincache
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'CMakeLists.txt', 'cmake/custom-triplets/**') }}
      - name: Initialize MSVC developer environment
        if: ${{ matrix.target == 'windows' }}
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64
      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.31.6     # <--= optional, stick to exactly 3.25.2 version
          ninjaVersion: 1.11.1     # <--= optional, stick to exactly 1.11.1 version
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13' 
      - name: Ensure vcpkg binary cache directories
        shell: bash
        run: |
          mkdir -p "${{ github.workspace }}/.vcpkg-bincache"
          if [ "${{ matrix.target }}" = "windows" ]; then
            mkdir -p "${{ github.workspace }}/.angle-bincache"
          fi
      - name: Restore from cache and setup vcpkg executable and data files.
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'vcpkg.json'

      - name: Setup ANGLE (Windows)
        if: ${{ matrix.target == 'windows' }}
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.angle-bincache
          VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.angle-bincache,readwrite
        shell: bash
        run: |
          mkdir -p "${{ github.workspace }}/.angle-bincache"
          test -d "${{ github.workspace }}/.angle-bincache"
          python tools/setup_angle.py --release-only --vcpkg "${{ github.workspace }}/vcpkg/vcpkg.exe"

      - name: Configure CMake and populate vcpkg binary cache
        uses: lukka/run-cmake@v10
        with:
          configurePreset: 'ninja-multi-vcpkg'
          configurePresetAdditionalArgs: "['-DCMAKE_OSX_ARCHITECTURES=x86_64']"


      - name: Save ANGLE cache
        if: ${{ always() && matrix.target == 'windows' && steps.angle-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ github.workspace }}/3rd/angle
            ${{ github.workspace }}/.angle-bincache
          key: ${{ steps.angle-cache.outputs.cache-primary-key }}
      - name: Save vcpkg binary cache
        if: ${{ always() && steps.vcpkg-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-bincache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Build
        shell: bash
        run: |
          cmake --build ./builds/ninja-multi-vcpkg --config "${{ env.PLUGIN_BUILD_CONFIG }}"

      - name: CMake install
        shell: bash
        run: |
          cmake --build ./builds/ninja-multi-vcpkg --config "${{ env.PLUGIN_BUILD_CONFIG }}" --target install

      - name: Verify package build config
        shell: bash
        run: |
          set -euo pipefail
          cfg="${{ env.PLUGIN_BUILD_CONFIG }}"
          [ -n "$cfg" ] || { echo "::error::PLUGIN_BUILD_CONFIG is empty"; exit 1; }
          case "${{ matrix.target }}" in
            windows) modbin="Injector.dll" ;;
            linux)   modbin="libInjector.so" ;;
            macos)   modbin="libInjector.dylib" ;;
            *) echo "::error::unknown platform ${{ matrix.target }}"; exit 1 ;;
          esac
          # 1) The requested configuration must have produced the module ...
          built=$(find builds/ninja-multi-vcpkg/src/DontStarveInjector -type f -path "*/${cfg}/${modbin}" -print -quit)
          if [ -z "$built" ]; then
            echo "::error::no ${modbin} built for configuration '${cfg}' (did the config reach cmake?)"
            find builds/ninja-multi-vcpkg -type f -name "$modbin" -print | head -20 || true
            exit 1
          fi
          # 2) ... and it must be the module the install staged into the package.
          installed="Mod/${modbin}"
          [ -f "$installed" ] || { echo "::error::${installed} is missing after install"; exit 1; }
          if [ "${{ matrix.target }}" = "windows" ]; then
            # PE installs are byte copies of the built module.
            if ! cmp -s "$built" "$installed"; then
              echo "::error::${installed} is not the '${cfg}' build — install used another configuration"
              exit 1
            fi
          else
            # ELF/Mach-O installs patch DT_RUNPATH / LC_RPATH in place: the build
            # tree keeps its absolute link dirs ($ORIGIN/deps:/…), the installed
            # copy only $ORIGIN/deps. Bytes therefore differ; the size does not.
            built_size=$(wc -c <"$built")
            installed_size=$(wc -c <"$installed")
            if [ "$built_size" != "$installed_size" ]; then
              echo "::error::${installed} (${installed_size} bytes) is not the '${cfg}' module (${built_size} bytes) — install used another configuration"
              exit 1
            fi
          fi
          echo "build config '${cfg}' verified against ${installed}"
          # 3) A non-Debug package must not carry debug-only vcpkg runtimes (install
          #    searches vcpkg debug/bin too, so a config mix-up ships them silently).
          if [ "${{ matrix.target }}" = "windows" ] && [ "$cfg" != "Debug" ]; then
            for root in builds/ninja-multi-vcpkg/vcpkg_installed vcpkg_installed; do
              for tripdir in "$root"/*/; do
                [ -d "${tripdir}debug/bin" ] || continue
                for dbg in "${tripdir}debug/bin/"*.dll; do
                  [ -e "$dbg" ] || continue
                  name=$(basename "$dbg")
                  [ -e "${tripdir}bin/$name" ] && continue
                  if [ -e "Mod/deps/$name" ]; then
                    echo "::error::debug-only vcpkg runtime Mod/deps/$name staged into a ${cfg} package"
                    exit 1
                  fi
                done
              done
            done
          fi

      - name: Collect debug symbols
        if: ${{ matrix.target == 'windows' }}
        shell: bash
        run: |
          set -euo pipefail
          cfg="${{ env.PLUGIN_BUILD_CONFIG }}"
          # Install never stages PDBs, so the mod zip (and the workshop item, which
          # filters them out) ships none — debuggers need them. Publish them as a
          # separate asset straight from the build tree; nothing enters Mod/.
          rm -rf symbols
          mkdir -p symbols dist
          shopt -s nullglob
          {
            find Mod -type f -name '*.dll' -not -path 'Mod/deps/*'
            # deps/ is third-party vcpkg; only the stock lua51 VM family gets symbols
            # here (its PDB is committed next to the dll).
            find Mod/deps -maxdepth 1 -type f -name 'lua51*.dll' 2>/dev/null || true
          } | sort -u | while IFS= read -r mod; do
            stem=$(basename "${mod%.dll}")
            if [ -f "${mod%.dll}.pdb" ]; then
              cp -f "${mod%.dll}.pdb" "symbols/${stem}.pdb"
              continue
            fi
            src=$(find builds/ninja-multi-vcpkg -type f -name "${stem}.pdb" -path "*/${cfg}/*" \
                    -not -path '*/vcpkg_installed/*' -not -path '*/CMakeFiles/*' | sort | head -1)
            if [ -n "$src" ]; then
              cp -f "$src" "symbols/${stem}.pdb"
            else
              echo "::warning::no ${cfg} PDB found for shipped module ${mod}"
            fi
          done
          count=$(find symbols -name '*.pdb' | wc -l)
          [ "$count" -gt 0 ] || { echo "::error::no PDBs collected for ${cfg}"; exit 1; }
          # The symbols must cover the modules needed to debug a crash on boot.
          for req in Injector Winmm plugin_core_vm plugin_manager; do
            [ -f "symbols/${req}.pdb" ] || { echo "::error::symbols/${req}.pdb is missing"; exit 1; }
          done
          python - "dist/${{ matrix.target }}_symbols.zip" symbols <<'PY'
          import pathlib, sys, zipfile
          out, root = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as zf:
              for p in sorted(root.rglob("*.pdb")):
                  zf.write(p, p.relative_to(root).as_posix())
          PY
          python - "dist/${{ matrix.target }}_symbols.zip" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as zf:
              names = zf.namelist()
          print(f"symbols bundle: {len(names)} PDBs: {', '.join(names)}")
          PY

      - name: Clean Up linux
        if: ${{ matrix.target == 'linux' }}
        run: |
          rm -rf ${{ github.workspace }}/Mod/bin64/windows
          rm -rf ${{ github.workspace }}/Mod/bin64/osx

      - name: Clean Up windows
        if: ${{ matrix.target == 'windows' }}
        run: |
          rm -r ${{ github.workspace }}/Mod/bin64/osx
          rm -r ${{ github.workspace }}/Mod/bin64/linux

      - name: Clean Up macos
        if: ${{ matrix.target == 'macos' }}
        run: |
          rm -rf ${{ github.workspace }}/Mod/bin64/windows
          rm -r ${{ github.workspace }}/Mod/bin64/linux

      - name: Generate per-platform plugin packages
        shell: bash
        run: |
          set -euo pipefail
          PLATFORM="${{ matrix.target }}"
          # Portable install layout (CMAKE_INSTALL_PREFIX=Mod): plugins live at
          # Mod/plugins/<name>/, not under bin64/<plat>/ (shell-only).
          # See CMakeLists.txt / ds_add_dynamic_plugin install rules.
          case "$PLATFORM" in
            windows|linux|macos) PDIR=Mod/plugins ;;
            *) echo "ERROR: unknown platform $PLATFORM"; exit 1 ;;
          esac
          if [ ! -d "$PDIR" ]; then
            echo "ERROR: plugins dir missing after install: $PDIR"
            ls -la Mod || true
            ls -la Mod/bin64 || true
            exit 1
          fi
          test -n "$(ls -A "$PDIR" 2>/dev/null)" || { echo "ERROR: empty plugins dir: $PDIR"; exit 1; }
          VERSION=$(python -c "import re, pathlib; t=pathlib.Path('CMakeLists.txt').read_text(encoding='utf-8'); m=re.search(r'project\\([^)]*VERSION\\s+([0-9]+\\.[0-9]+\\.[0-9]+)', t); assert m, 'version not found'; print(m.group(1))")
          TAG="${GITHUB_REF_NAME:-}"
          if [[ "${GITHUB_REF:-}" == refs/heads/master ]]; then
            TAG="preview-${{ github.run_id }}-${GITHUB_SHA:0:7}"
          fi
          mkdir -p dist
          python tools/gen_plugins_manifest.py \
            --plugins-dir "$PDIR" \
            --platform "$PLATFORM" \
            --repo fesily/DontStarveLuaJIT2 \
            --release-tag "$TAG" \
            --mod-version "$VERSION" \
            --build-config "$PLUGIN_BUILD_CONFIG" \
            --source-root . \
            --out-manifest "dist/plugins-manifest.${PLATFORM}.json" \
            --out-zips-dir dist \
            --write-meta

      - name: Upload plugin zips and partial manifest
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-plugins
          path: |
            ${{ github.workspace }}/dist/plugin_*.zip
            ${{ github.workspace }}/dist/plugins-manifest.${{ matrix.target }}.json
          if-no-files-found: error

      - name: Publish mapped modules as <name>.pkg
        if: ${{ matrix.target == 'windows' }}
        shell: bash
        run: |
          set -euo pipefail
          # The package must not list a filename the game maps: Steam (and any in-place
          # updater) can neither overwrite nor delete a mapped DLL, so a canonical name in
          # the shipped tree makes workshop updates impossible while the game runs. The
          # runtime materializes the canonical name before LoadLibrary
          # (src/DontStarveInjector/core/PackagedModule.hpp).
          python tools/pack_payload.py Mod

      - name: Archive Release
        uses: thedoctor0/zip-release@0.7.5
        with:
          path: ./Mod
          filename: ${{ matrix.target }}_Mod.zip
          directory: ${{ github.workspace }}

      - name: Upload packaged mod
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-mod-zip
          path: ${{ github.workspace }}/${{ matrix.target }}_Mod.zip
          if-no-files-found: error

      - name: Upload debug symbols
        if: ${{ matrix.target == 'windows' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-symbols
          path: ${{ github.workspace }}/dist/${{ matrix.target }}_symbols.zip
          if-no-files-found: error

  merge-plugins-manifest:
    needs: compile
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: ${{ github.workspace }}/artifacts

      - name: Merge plugin manifests
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          PARTIALS=(artifacts/*-plugins/plugins-manifest.*.json)
          if [ ${#PARTIALS[@]} -eq 0 ]; then
            echo "ERROR: no partial plugins-manifest files found"
            find artifacts -type f | head -200 || true
            exit 1
          fi
          BUNDLES=(artifacts/*-mod-zip/*_Mod.zip)
          EXTRA=()
          if [ ${#BUNDLES[@]} -gt 0 ]; then
            EXTRA=(--bundle-zips "${BUNDLES[@]}")
          fi
          python tools/gen_plugins_manifest.py --merge \
            "${PARTIALS[@]}" \
            "${EXTRA[@]}" \
            --out plugins-manifest.json
          echo "Merged plugins-manifest.json:"
          python -c "import json; d=json.load(open('plugins-manifest.json',encoding='utf-8')); print('plugins', len(d.get('plugins',[])), 'bundle', list((d.get('bundle') or {}).keys()))"

      - name: Upload plugins-manifest
        uses: actions/upload-artifact@v4
        with:
          name: plugins-manifest
          path: ${{ github.workspace }}/plugins-manifest.json
          if-no-files-found: error

  publish-release:
    needs: [compile, merge-plugins-manifest]
    if: startsWith(github.ref, 'refs/tags/') && !startsWith(github.ref, 'refs/tags/preview-')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, target: windows, platform: win32-x64 }
          - { os: ubuntu-24.04,   target: linux,   platform: linux-x64 }
          # - { os: macos-14,       target: macos,   platform: macos-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Download packaged mod
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.target }}-mod-zip
          path: ${{ github.workspace }}

      - name: Download platform plugin packages
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.target }}-plugins
          path: ${{ github.workspace }}/plugin-assets

      - name: Download plugins-manifest
        uses: actions/download-artifact@v4
        with:
          name: plugins-manifest
          path: ${{ github.workspace }}

      - name: Download debug symbols (windows)
        if: ${{ matrix.target == 'windows' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.target }}-symbols
          path: ${{ github.workspace }}/symbols-assets

      - name: Publish release assets
        uses: ncipollo/release-action@v1.14.0
        with:
          artifacts: |
            ${{ github.workspace }}/${{ matrix.target }}_Mod.zip
            ${{ github.workspace }}/plugins-manifest.json
            ${{ github.workspace }}/plugin-assets/*.zip
            ${{ github.workspace }}/symbols-assets/*_symbols.zip
          allowUpdates: true

  publish-preview:
    needs: [compile, merge-plugins-manifest]
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read project version
        id: project-version
        run: |
          version=$(grep -oP 'project\([^)]*VERSION\s+\K[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Download packaged mods
        uses: actions/download-artifact@v4
        with:
          path: ${{ github.workspace }}/artifacts

      - name: Publish preview release
        uses: ncipollo/release-action@v1.14.0
        with:
          artifacts: |
            ${{ github.workspace }}/artifacts/*/*_Mod.zip
            ${{ github.workspace }}/artifacts/plugins-manifest/plugins-manifest.json
            ${{ github.workspace }}/artifacts/*-plugins/*.zip
            ${{ github.workspace }}/artifacts/*-symbols/*_symbols.zip
          allowUpdates: true
          prerelease: true
          makeLatest: false
          tag: preview-${{ github.run_id }}-${{ steps.project-version.outputs.short_sha }}
          name: Preview v${{ steps.project-version.outputs.version }} (${{ steps.project-version.outputs.short_sha }})
          commit: ${{ github.sha }}
