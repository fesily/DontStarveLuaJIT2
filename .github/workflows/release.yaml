name: build

permissions:
  contents: write

on:
  push:
    branches:
      - master
    tags:
      - "*"
  pull_request:
    branches:
      - master

jobs:
  compile:
    env:
      # Single source for the CMake configuration of shipped plugins: it decides both
      # the build and the build_config stamp in meta/manifest (installs refuse mismatches).
      PLUGIN_BUILD_CONFIG: RelWithDebInfo
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-bincache
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg-bincache,readwrite
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, target: windows, platform: win32-x64 }
          - { os: ubuntu-24.04,   target: linux,   platform: linux-x64 }
          # - { os: macos-14,       target: macos,   platform: macos-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
      - name: Restore ANGLE cache
        if: ${{ matrix.target == 'windows' }}
        id: angle-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ github.workspace }}/3rd/angle
            ${{ github.workspace }}/.angle-bincache
          key: ${{ runner.os }}-angle-${{ hashFiles('tools/angle/**', 'cmake/ports/angle/**', 'cmake/custom-triplets/**', 'tools/setup_angle.py') }}
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-bincache
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'CMakeLists.txt', 'cmake/custom-triplets/**') }}
      - name: Initialize MSVC developer environment
        if: ${{ matrix.target == 'windows' }}
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64
      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.31.6     # <--= optional, stick to exactly 3.25.2 version
          ninjaVersion: 1.11.1     # <--= optional, stick to exactly 1.11.1 version
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13' 
      - name: Ensure vcpkg binary cache directories
        shell: bash
        run: |
          mkdir -p "${{ github.workspace }}/.vcpkg-bincache"
          if [ "${{ matrix.target }}" = "windows" ]; then
            mkdir -p "${{ github.workspace }}/.angle-bincache"
          fi
      - name: Restore from cache and setup vcpkg executable and data files.
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'vcpkg.json'

      - name: Setup ANGLE (Windows)
        if: ${{ matrix.target == 'windows' }}
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.angle-bincache
          VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.angle-bincache,readwrite
        shell: bash
        run: |
          mkdir -p "${{ github.workspace }}/.angle-bincache"
          test -d "${{ github.workspace }}/.angle-bincache"
          python tools/setup_angle.py --release-only --vcpkg "${{ github.workspace }}/vcpkg/vcpkg.exe"

      - name: Configure CMake and populate vcpkg binary cache
        uses: lukka/run-cmake@v10
        with:
          configurePreset: 'ninja-multi-vcpkg'
          configurePresetAdditionalArgs: "['-DCMAKE_OSX_ARCHITECTURES=x86_64']"


      - name: Save ANGLE cache
        if: ${{ always() && matrix.target == 'windows' && steps.angle-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ github.workspace }}/3rd/angle
            ${{ github.workspace }}/.angle-bincache
          key: ${{ steps.angle-cache.outputs.cache-primary-key }}
      - name: Save vcpkg binary cache
        if: ${{ always() && steps.vcpkg-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-bincache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Build
        run: |
          cmake --build ./builds/ninja-multi-vcpkg --config "$PLUGIN_BUILD_CONFIG"

      - name: CMake install
        run: |
          cmake --build ./builds/ninja-multi-vcpkg --config "$PLUGIN_BUILD_CONFIG" --target install

      - name: Clean Up linux
        if: ${{ matrix.target == 'linux' }}
        run: |
          rm -rf ${{ github.workspace }}/Mod/bin64/windows
          rm -rf ${{ github.workspace }}/Mod/bin64/osx

      - name: Clean Up windows
        if: ${{ matrix.target == 'windows' }}
        run: |
          rm -r ${{ github.workspace }}/Mod/bin64/osx
          rm -r ${{ github.workspace }}/Mod/bin64/linux

      - name: Clean Up macos
        if: ${{ matrix.target == 'macos' }}
        run: |
          rm -rf ${{ github.workspace }}/Mod/bin64/windows
          rm -r ${{ github.workspace }}/Mod/bin64/linux

      - name: Generate per-platform plugin packages
        shell: bash
        run: |
          set -euo pipefail
          PLATFORM="${{ matrix.target }}"
          # Portable install layout (CMAKE_INSTALL_PREFIX=Mod): plugins live at
          # Mod/plugins/<name>/, not under bin64/<plat>/ (shell-only).
          # See CMakeLists.txt / ds_add_dynamic_plugin install rules.
          case "$PLATFORM" in
            windows|linux|macos) PDIR=Mod/plugins ;;
            *) echo "ERROR: unknown platform $PLATFORM"; exit 1 ;;
          esac
          if [ ! -d "$PDIR" ]; then
            echo "ERROR: plugins dir missing after install: $PDIR"
            ls -la Mod || true
            ls -la Mod/bin64 || true
            exit 1
          fi
          test -n "$(ls -A "$PDIR" 2>/dev/null)" || { echo "ERROR: empty plugins dir: $PDIR"; exit 1; }
          VERSION=$(python -c "import re, pathlib; t=pathlib.Path('CMakeLists.txt').read_text(encoding='utf-8'); m=re.search(r'project\\([^)]*VERSION\\s+([0-9]+\\.[0-9]+\\.[0-9]+)', t); assert m, 'version not found'; print(m.group(1))")
          TAG="${GITHUB_REF_NAME:-}"
          if [[ "${GITHUB_REF:-}" == refs/heads/master ]]; then
            TAG="preview-${{ github.run_id }}-${GITHUB_SHA:0:7}"
          fi
          mkdir -p dist
          python tools/gen_plugins_manifest.py \
            --plugins-dir "$PDIR" \
            --platform "$PLATFORM" \
            --repo fesily/DontStarveLuaJIT2 \
            --release-tag "$TAG" \
            --mod-version "$VERSION" \
            --build-config "$PLUGIN_BUILD_CONFIG" \
            --source-root . \
            --out-manifest "dist/plugins-manifest.${PLATFORM}.json" \
            --out-zips-dir dist \
            --write-meta

      - name: Upload plugin zips and partial manifest
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-plugins
          path: |
            ${{ github.workspace }}/dist/plugin_*.zip
            ${{ github.workspace }}/dist/plugins-manifest.${{ matrix.target }}.json
          if-no-files-found: error

      - name: Archive Release
        uses: thedoctor0/zip-release@0.7.5
        with:
          path: ./Mod
          filename: ${{ matrix.target }}_Mod.zip
          directory: ${{ github.workspace }}

      - name: Upload packaged mod
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-mod-zip
          path: ${{ github.workspace }}/${{ matrix.target }}_Mod.zip
          if-no-files-found: error

  merge-plugins-manifest:
    needs: compile
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: ${{ github.workspace }}/artifacts

      - name: Merge plugin manifests
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          PARTIALS=(artifacts/*-plugins/plugins-manifest.*.json)
          if [ ${#PARTIALS[@]} -eq 0 ]; then
            echo "ERROR: no partial plugins-manifest files found"
            find artifacts -type f | head -200 || true
            exit 1
          fi
          BUNDLES=(artifacts/*-mod-zip/*_Mod.zip)
          EXTRA=()
          if [ ${#BUNDLES[@]} -gt 0 ]; then
            EXTRA=(--bundle-zips "${BUNDLES[@]}")
          fi
          python tools/gen_plugins_manifest.py --merge \
            "${PARTIALS[@]}" \
            "${EXTRA[@]}" \
            --out plugins-manifest.json
          echo "Merged plugins-manifest.json:"
          python -c "import json; d=json.load(open('plugins-manifest.json',encoding='utf-8')); print('plugins', len(d.get('plugins',[])), 'bundle', list((d.get('bundle') or {}).keys()))"

      - name: Upload plugins-manifest
        uses: actions/upload-artifact@v4
        with:
          name: plugins-manifest
          path: ${{ github.workspace }}/plugins-manifest.json
          if-no-files-found: error

  publish-release:
    needs: [compile, merge-plugins-manifest]
    if: startsWith(github.ref, 'refs/tags/') && !startsWith(github.ref, 'refs/tags/preview-')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, target: windows, platform: win32-x64 }
          - { os: ubuntu-24.04,   target: linux,   platform: linux-x64 }
          # - { os: macos-14,       target: macos,   platform: macos-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Download packaged mod
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.target }}-mod-zip
          path: ${{ github.workspace }}

      - name: Download platform plugin packages
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.target }}-plugins
          path: ${{ github.workspace }}/plugin-assets

      - name: Download plugins-manifest
        uses: actions/download-artifact@v4
        with:
          name: plugins-manifest
          path: ${{ github.workspace }}

      - name: Publish release assets
        uses: ncipollo/release-action@v1.14.0
        with:
          artifacts: |
            ${{ github.workspace }}/${{ matrix.target }}_Mod.zip
            ${{ github.workspace }}/plugins-manifest.json
            ${{ github.workspace }}/plugin-assets/*.zip
          allowUpdates: true

  # Steam Workshop deploy: uploads the packaged Windows mod (windows_Mod.zip release asset
  # minus debug/link artifacts, see .github/workshop.deployignore) to the workshop item.
  # Windows only on purpose — the item mirrors the client build players subscribe to;
  # Linux / dedicated-server users install from the GitHub release. The item must already
  # exist on Steam (SteamCMD updates it in place).
  #
  # Required repo secrets (Settings → Secrets and variables → Actions):
  #   STEAM_USERNAME    Steam account that owns the workshop item
  #   STEAM_CONFIG_VDF  SteamCMD MFA file: contents of config/config.vdf from a SteamCMD
  #                     install that completed Steam Guard once for that account
  #                       steamcmd +login <user> <pass>    # enter the emailed code
  #                       steamcmd +login <user> +quit     # no code asked -> file is ready
  #                     If Steam later emails a new code run
  #                     `steamcmd +set_steam_guard_code <code>` and refresh the secret.
  # Optional repo variable:
  #   STEAM_WORKSHOP_ITEM_ID  item to update (defaults to the published mod)
  deploy-workshop:
    needs: [compile]
    if: startsWith(github.ref, 'refs/tags/') && !startsWith(github.ref, 'refs/tags/preview-')
    runs-on: ubuntu-24.04
    env:
      STEAM_WORKSHOP_APP_ID: "322330" # Don't Starve Together
      STEAM_WORKSHOP_ITEM_ID: ${{ vars.STEAM_WORKSHOP_ITEM_ID || '3444078585' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Steam credentials
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$STEAM_USERNAME" ]; then
            echo "::error::repository secret STEAM_USERNAME is not set (Steam account owning workshop item $STEAM_WORKSHOP_ITEM_ID)"
            exit 1
          fi
          if [ -z "$STEAM_CONFIG_VDF" ]; then
            echo "::error::repository secret STEAM_CONFIG_VDF is not set (SteamCMD MFA file, see the deploy-workshop job comment)"
            exit 1
          fi

      - name: Download packaged windows mod
        uses: actions/download-artifact@v4
        with:
          pattern: windows-mod-zip
          path: ${{ github.workspace }}/artifacts

      - name: Read project version
        id: project-version
        shell: bash
        run: |
          version=$(grep -oP 'project\([^)]*VERSION\s+\K[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Stage workshop content (windows)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          ZIPS=(artifacts/windows-mod-zip/*_Mod.zip)
          if [ ${#ZIPS[@]} -ne 1 ]; then
            echo "::error::expected exactly one windows-mod-zip artifact, found ${#ZIPS[@]}"
            find artifacts -type f | head -50 || true
            exit 1
          fi
          rm -rf unzip workshop
          mkdir -p unzip workshop
          unzip -q "${ZIPS[0]}" -d unzip
          # zip-release archives ./Mod, so members are rooted at Mod/. The workshop
          # content root must be the mod root itself (modinfo.lua at the top level).
          root=unzip/Mod
          if [ ! -f "$root/modinfo.lua" ]; then
            echo "::error::${ZIPS[0]} does not contain Mod/modinfo.lua"
            find unzip -maxdepth 2 | head -50 || true
            exit 1
          fi
          rsync -a --exclude-from=.github/workshop.deployignore "$root/" workshop/
          # A package that lost its payload must fail the job, never silently ship a
          # half item to subscribers.
          for m in Injector.dll bin64/windows/Winmm.dll; do
            if [ ! -e "workshop/$m" ]; then
              echo "::error::windows payload member $m is missing from the staged content"
              exit 1
            fi
          done
          if find workshop -name '*.pdb' -print -quit | grep -q .; then
            echo "::error::debug symbols survived .github/workshop.deployignore"
            exit 1
          fi
          # The action also reads .deployignore from the content root, so a manual re-run
          # of the action against this directory applies the same rules.
          cp .github/workshop.deployignore workshop/.deployignore
          echo "workshop content: $(find workshop -type f | wc -l) files, $(du -sh workshop | cut -f1) (package: $(du -sh unzip | cut -f1))"

      - name: Deploy to Steam Workshop
        uses: ./.github/actions/steam-workshop-deploy
        with:
          username: ${{ secrets.STEAM_USERNAME }}
          configVdf: ${{ secrets.STEAM_CONFIG_VDF }}
          appId: ${{ env.STEAM_WORKSHOP_APP_ID }}
          publishedFileId: ${{ env.STEAM_WORKSHOP_ITEM_ID }}
          path: workshop
          # Fork addition: Steam key-value tag. Metadata only — the `version:<modinfo
          # version>` *plain* tag that DST reads cannot be written by SteamCMD, so it
          # still comes from an authenticated UGC client (see the action's README).
          kvTags: |
            version=${{ steps.project-version.outputs.version }}
          changeNote: "v${{ steps.project-version.outputs.version }} (${{ steps.project-version.outputs.short_sha }}) - https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"

  publish-preview:
    needs: [compile, merge-plugins-manifest]
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read project version
        id: project-version
        run: |
          version=$(grep -oP 'project\([^)]*VERSION\s+\K[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Download packaged mods
        uses: actions/download-artifact@v4
        with:
          path: ${{ github.workspace }}/artifacts

      - name: Publish preview release
        uses: ncipollo/release-action@v1.14.0
        with:
          artifacts: |
            ${{ github.workspace }}/artifacts/*/*_Mod.zip
            ${{ github.workspace }}/artifacts/plugins-manifest/plugins-manifest.json
            ${{ github.workspace }}/artifacts/*-plugins/*.zip
          allowUpdates: true
          prerelease: true
          makeLatest: false
          tag: preview-${{ github.run_id }}-${{ steps.project-version.outputs.short_sha }}
          name: Preview v${{ steps.project-version.outputs.version }} (${{ steps.project-version.outputs.short_sha }})
          commit: ${{ github.sha }}
